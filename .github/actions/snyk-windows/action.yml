name: "snyk-windows"
description: "setup snyk on windows"
inputs:
  command:
    description: "Which Snyk command to run, defaults to test"
    default: test
  args:
    description: "Additional arguments to pass to Snyk"
runs:
  using: "composite"
  steps:
    - shell: pwsh
      run: gh release download -R snyk/cli  --pattern snyk-win.exe
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - shell: pwsh
      env:
        INPUTS_COMMAND: ${{ inputs.command }}
        INPUTS_ARGS: ${{ inputs.args }}
      # In pwsh, environment variables are only reachable as $env:NAME - a bare $INPUTS_ARGS is an empty
      # PowerShell variable, so snyk ran without arguments, printed its help and exited 0.
      run: |
        $snykArgs = @($env:INPUTS_COMMAND) + ($env:INPUTS_ARGS -split '\s+' | Where-Object { $_ })
        & .\snyk-win.exe @snykArgs
