name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - '.trivyignore.yml'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  golang_version: '1.27'
  # Fix slow Go compile and cache restore
  # See https://github.com/actions/setup-go/pull/515
  GOCACHE: D:\gocache
  GOMODCACHE: D:\gomodcache
  GOTMPDIR: D:\gotmp

jobs:
  audit:
    name: Audit
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      id-token: write # SonarQube Cloud login without a stored token
    env:
      sonar_available: ${{ secrets.SONAR_TOKEN  != '' && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: mkdir ${{ env.GOTMPDIR }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.golang_version }}
          check-latest: true

      - name: Set dependency versions
        id: versions
        run: Get-Content versions.txt | Add-Content $env:GITHUB_ENV

      - name: Audit
        # Go requires gotmp to be present
        run: |
          go mod download
          make audit
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: "[Release] Set up Snyk CLI"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: steadybit/extension-kit/.github/actions/setup-snyk@main # NOSONAR githubactions:S7637 - our own action

      - name: "[Release] Snyk test"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}
        run: snyk test --org="$env:SNYK_ORG_ID" --severity-threshold=high --project-name="$env:GITHUB_REPOSITORY" --target-reference="$env:GITHUB_REF_NAME"

      # Secretless analysis: SonarQube Cloud exchanges the identity of this job for a token that is valid
      # for 30 minutes and for the project bound to this repository only. Pull requests from forks and
      # Dependabot runs get no identity; the stored SONAR_TOKEN stays as the fallback for now.
      - name: SonarQube Cloud login
        id: sonar-auth
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2 NOSONAR githubactions:S7637 - verified action creator
        with:
          export-env: false

      - name: Report a fallback to the stored Sonar token
        if: ${{ steps.sonar-auth.outcome == 'failure' && env.sonar_available == 'true' }}
        run: echo "::warning::SonarQube Cloud login without a token failed, the scan uses the stored SONAR_TOKEN. See the login step."

      - name: SonarCloud Scan
        if: ${{ steps.sonar-auth.outputs.sonar-token != '' || env.sonar_available == 'true' }}
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token || secrets.SONAR_TOKEN }}

      - name: "[Release] SonarCloud Quality Gate check"
        if: ${{ startsWith(github.ref, 'refs/tags/') && (steps.sonar-auth.outputs.sonar-token != '' || env.sonar_available == 'true') }}
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token || secrets.SONAR_TOKEN }}

  build:
    name: Build & Release
    needs: audit
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.sanitize.outputs.SANITIZED_ARTIFACT_NAME }}
      artifact-id: ${{ steps.artifact-upload.outputs.artifact-id }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: mkdir ${{ env.GOTMPDIR }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.golang_version }}
          check-latest: true

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Set dependency versions
        id: versions
        run: Get-Content versions.txt | Add-Content $env:GITHUB_ENV

      - name: Build extension installer
        # Go requires gotmp to be present.
        # On tag pushes, clear SNAPSHOT_FLAG so goreleaser uses the git tag
        # as the version (instead of the snapshot template).
        run: make installer SNAPSHOT_FLAG="${{ startsWith(github.ref, 'refs/tags/') && '' || '--snapshot' }}"
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: "[Release] Set up Snyk CLI"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: steadybit/extension-kit/.github/actions/setup-snyk@main # NOSONAR githubactions:S7637 - our own action

      - name: "[Release] Snyk monitor release candidate"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}
        run: snyk monitor --org="$env:SNYK_ORG_ID" --severity-threshold=high --project-name="$env:GITHUB_REPOSITORY" --target-reference=release-candidate

      - name: Upload Artifacts
        id: artifact-upload
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/*.zip
            dist/*.msi
          retention-days: 7

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          fail_on_unmatched_files: true
          files: "dist/*.zip"

  upload-to-s3:
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6 # NOSONAR githubactions:S7637 - verified action creator
        with:
          aws-region: 'eu-central-1'
          role-to-assume: 'arn:aws:iam::292929100161:role/allow-auto-deploy-from-other-accounts'
          role-duration-seconds: 900
          role-session-name: S3DeployWindowsArtifacts

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: artifact/

      - name: Zip artifact
        shell: bash
        run: |
          SUFFIX="${{ github.head_ref || github.ref_name }}"
          zip -j "windows-host-extension-$SUFFIX.zip" artifact/*.msi
          zip -j windows-host-extension-latest.zip artifact/*.msi

      - name: Upload to S3
        shell: bash
        run: |
          aws s3 cp windows-host-extension-latest.zip "s3://windows-registry.steadybit.com/steadybit-extension-host-windows/"
          sha256sum windows-host-extension-latest.zip > windows-host-extension-latest.sha256
          aws s3 cp windows-host-extension-latest.sha256 "s3://windows-registry.steadybit.com/steadybit-extension-host-windows/windows-host-extension-latest.sha256"

          SUFFIX="${{ github.head_ref || github.ref_name }}"
          aws s3 cp "windows-host-extension-$SUFFIX.zip" "s3://windows-registry.steadybit.com/steadybit-extension-host-windows/"
          sha256sum "windows-host-extension-$SUFFIX.zip" > "windows-host-extension-$SUFFIX.sha256"
          aws s3 cp "windows-host-extension-$SUFFIX.sha256" "s3://windows-registry.steadybit.com/steadybit-extension-host-windows/windows-host-extension-$SUFFIX.sha256"

  snyk-monitor:
    name: "[Release] Snyk Monitor latest"
    needs: [upload-to-s3]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: mkdir ${{ env.GOTMPDIR }}
      # Snyk takes the stdlib version of the Go scan from this toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.golang_version }}
          check-latest: true
      - name: Set up Snyk CLI
        uses: steadybit/extension-kit/.github/actions/setup-snyk@main # NOSONAR githubactions:S7637 - our own action
      - name: Snyk monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --severity-threshold=high --project-name="$env:GITHUB_REPOSITORY" --target-reference=latest

  refresh-demo:
    name: Refresh Dev Demo
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Update EC2 Windows Demo
        uses: the-actions-org/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7
        with:
          # File name, not display name: the action only searches the first 30 workflows when given a name.
          workflow: windows-demo-deploy.yml
          ref: main
          repo: steadybit/infrastructure-live
          inputs: >-
            {
              "extension_run_id": "${{ github.run_id }}"
            }
          token: ${{ secrets.PAT_TOKEN }}

